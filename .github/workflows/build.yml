name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/FluentTimer.Core.Tests -c Release

      - name: Publish
        run: dotnet publish src/FluentTimer.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FluentTimer-win-x64
          path: publish/FluentTimer.exe
