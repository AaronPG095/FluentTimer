name: Workflow Sync

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for workflow drift
        id: check_drift
        run: |
          if node scripts/sync.mjs --remote --check; then
            echo "drift=false" >> $GITHUB_OUTPUT
          else
            echo "drift=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync latest workflow from upstream
        if: steps.check_drift.outputs.drift == 'true'
        run: |
          node scripts/sync.mjs --remote

      - name: Create Pull Request
        if: steps.check_drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/sync-workflow"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(workflow): sync to latest AI-Dev-Workflow"
          git push origin "$branch" --force
          gh pr create \
            --title "chore(workflow): sync to latest AI-Dev-Workflow" \
            --body "Automated workflow sync from upstream [AI-Dev-Workflow](https://github.com/AaronPG095/AI-Dev-Workflow). Review changes and merge when ready." \
            --label "no-plan" || echo "PR already exists"
