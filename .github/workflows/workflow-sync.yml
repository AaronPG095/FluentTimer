name: Workflow Sync

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository != 'AaronPG095/AI-Dev-Workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report workflow drift
        run: |
          result=0
          node scripts/sync.mjs --remote --check || result=$?
          case "$result" in
            0) ;;
            1) echo "::notice::Workflow drift detected. Run sync on a branch and open a PR with an approved plan." ;;
            *) exit "$result" ;;
          esac
